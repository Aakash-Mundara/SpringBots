spring:
  application:
    name: onboardiq
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboardiq}
    username: ${DB_USER:onboardiq}
    password: ${DB_PASSWORD:onboardiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Kolkata}
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 2MB          # app-level limit is 1 MB (Section 7.2); 2 MB lets us return a clean 4xx
      max-request-size: 3MB

server:
  port: 8080

onboardiq:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  data-dir: ${DATA_DIR:/data}
  seed:
    enabled: ${SEED_ENABLED:true}
    rules-config-file: ${RULES_CONFIG_FILE:${onboardiq.data-dir}/case_02_rules_config_V1.0.json}
    occupations-file: ${onboardiq.data-dir}/case_02_occupations_V1.0.csv
    sanctions-file: ${onboardiq.data-dir}/case_02_sanctions_list_V1.0.csv
    pep-file: ${onboardiq.data-dir}/case_02_pep_list_V1.0.csv
    existing-customers-file: ${onboardiq.data-dir}/case_02_existing_customers_V1.0.csv
    demo-password: ${DEMO_PASSWORD:Passw0rd!}
  # Placeholders for later phases (read here so every value comes from the environment)
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  aws:
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${AWS_ENDPOINT:}
    s3-bucket: ${S3_BUCKET:onboardiq-docs}
    sqs-queue: ${SQS_QUEUE:onboardiq-extraction}
    sqs-dlq: ${SQS_DLQ:onboardiq-extraction-dlq}
  extraction:
    provider: ${EXTRACTION_PROVIDER:mock}
    mock-files: ${MOCK_EXTRACTION_FILES:/data/case_02_extraction_mock_sample_V1.0.csv,/data/case_02_extraction_mock_eval_V1.0.csv}
    ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
    ai-timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
  service-key: ${SERVICE_KEY:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
