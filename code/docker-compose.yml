# OnboardIQ — local stack. Run from /code:  docker compose up --build
# Phase 1 brings up postgres + localstack + backend. ai-service and frontend are added in Phases 7 and 8.
name: onboardiq

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: onboardiq
      POSTGRES_USER: onboardiq
      POSTGRES_PASSWORD: onboardiq
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardiq -d onboardiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-south-1
      S3_BUCKET: onboardiq-docs
      SQS_QUEUE: onboardiq-extraction
      SQS_DLQ: onboardiq-extraction-dlq
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # "ready" file is written by init-aws.sh only after bucket + both queues exist
      test: ["CMD-SHELL", "test -f /tmp/onboardiq-ready && awslocal sqs get-queue-url --queue-name onboardiq-extraction >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/onboardiq
      DB_USER: onboardiq
      DB_PASSWORD: onboardiq
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-32b}
      AWS_REGION: ap-south-1
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test          # LocalStack accepts any key; real AWS uses docker-compose.aws.yml
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: onboardiq-docs
      SQS_QUEUE: onboardiq-extraction
      SQS_DLQ: onboardiq-extraction-dlq
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      MOCK_EXTRACTION_FILES: /data/case_02_extraction_mock_sample_V1.0.csv,/data/case_02_extraction_mock_eval_V1.0.csv
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_SECONDS: 10
      SERVICE_KEY: ${SERVICE_KEY:-change-me}
      APP_TIMEZONE: Asia/Kolkata
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data:ro
      - ../output:/output
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  pgdata:
