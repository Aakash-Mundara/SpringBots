spring:
  application:
    name: onboardiq
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboardiq}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local}
      s3:
        endpoint: ${S3_ENDPOINT:http://localhost:8333}
        path-style-access-enabled: true
      sqs:
        endpoint: ${SQS_ENDPOINT:http://localhost:9324}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  timezone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-32-chars-minimum}
    ttl-minutes: 240
  s3:
    bucket: onboardiq-docs
  sqs:
    queue: onboardiq-extraction
    dlq: onboardiq-extraction-dlq
  extraction:
    provider: ${EXTRACTION_PROVIDER:mock}
    mock-files: ./data/case_02_extraction_mock_sample_V1.0.csv,./data/case_02_extraction_mock_eval_V1.0.csv
    timeout-seconds: 10
  ai:
    provider-order: groq,gemini,regex
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model: ${GROQ_MODEL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
    requests-per-minute: 20
  corebanking:
    service-key: ${SERVICE_KEY:local-service-key}
